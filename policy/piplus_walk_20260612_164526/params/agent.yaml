seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 70000
ckpt_manipulator: null
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  actor_hidden_dims:
  - 256
  - 128
  - 128
  critic_hidden_dims:
  - 256
  - 128
  - 128
  activation: elu
algorithm:
  class_name: WasabiPPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.006
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  optimizer_class_name: AdamW
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  advantage_mixing_weights: 1.0
  desired_kl: 0.01
  max_grad_norm: 1.0
  clip_min_std: 1.0e-12
  discriminator_kwargs:
    hidden_sizes:
    - 1024
    - 512
    nonlinearity: ReLU
  discriminator_reward_coef: 0.25
  discriminator_reward_type: quad
  discriminator_loss_func: MSELoss
  discriminator_gradient_penalty_coef: 5.0
  discriminator_optimizer_class_name: AdamW
  discriminator_weight_decay_coef: 0.0003
  discriminator_logit_weight_decay_coef: 0.04
  discriminator_optimizer_kwargs:
    lr: 0.0001
    betas:
    - 0.9
    - 0.999
save_interval: 1000
log_interval: 1
experiment_name: piplus_1W0G_LSE_walk
run_name: _GPU1
resume: true
load_run: /home/niuyuhao/Project/HT_lab/logs/instinct_rl/piplus_1W0G_LSE_walk/20260605_150432.*
load_checkpoint: model_176000.pt
normalizers:
  policy:
    class_name: EmpiricalNormalization
  critic:
    class_name: EmpiricalNormalization
empirical_normalization: false
